name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build date
        id: date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short,enable=${{ github.ref_type != 'tag' }}

      # amd64 only for now: the linux/arm64 leg of this build (cross-compiled
      # under QEMU emulation via docker/setup-qemu-action) hung indefinitely
      # on the "Build and push" step in practice instead of failing outright,
      # rather than the apt-get/pip steps themselves being slow -- dropped
      # QEMU and arm64 to unblock amd64 (all Unraid boxes, which is the only
      # target that actually matters right now) rather than debug a wedged
      # GitHub-hosted runner. Re-add `docker/setup-qemu-action@v3` above and
      # `linux/arm64` to platforms below if arm64 support is needed later --
      # just budget for it hanging again and worth confirming it completes
      # before relying on it.
      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          # BuildKit's default "auto" progress mode can collapse/truncate a
          # RUN step's own stdout/stderr in the Actions log down to just the
          # final "did not complete successfully" summary -- "plain" streams
          # everything, uncollapsed.
          BUILDKIT_PROGRESS: plain
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.date.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
