<style>
  :root {
    color-scheme: dark;
    --bg: #0f172a;
    --panel: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --free: #4ade80;
    --error: #f87171;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Consolas, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px 16px 48px;
  }
  main { max-width: 860px; margin: 0 auto; }
  h1 {
    font-size: 22px;
    margin: 0 0 4px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  h1 .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--muted);
    flex: none;
  }
  h1 .dot.live { background: var(--free); box-shadow: 0 0 0 3px rgba(74,222,128,.2); }
  h1 .dot.err { background: var(--error); box-shadow: 0 0 0 3px rgba(248,113,113,.2); }

  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  #scan-now {
    font: inherit;
    font-size: 13px;
    color: var(--text);
    background: rgba(148, 163, 184, .12);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 14px;
    cursor: pointer;
  }
  #scan-now:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  #scan-now:disabled { opacity: .6; cursor: default; }

  #meta { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  #meta span { font-family: var(--mono); }

  .scan-progress { margin: 10px 0 24px; }
  .scan-progress .track {
    height: 8px;
    border-radius: 999px;
    background: rgba(148, 163, 184, .18);
    overflow: hidden;
  }
  .scan-progress .fill {
    height: 100%;
    border-radius: 999px;
    background: var(--accent);
    width: 0%;
    transition: width .3s ease;
  }
  .scan-progress.indeterminate .fill {
    width: 30% !important;
    animation: scan-indeterminate 1.2s ease-in-out infinite;
  }
  @keyframes scan-indeterminate {
    0% { margin-left: -30%; }
    100% { margin-left: 100%; }
  }
  .scan-progress .detail { color: var(--muted); font-size: 13px; margin-top: 6px; }

  .next-free {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 20px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .next-free .label { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .05em; }
  .next-free .value { font-family: var(--mono); font-size: 28px; color: var(--free); font-weight: 600; }
  .next-free .count { color: var(--muted); font-size: 13px; }

  section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 16px;
  }
  section h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--muted);
    margin: 0 0 12px;
    font-weight: 600;
  }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; }
  th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
  th.sortable:hover { color: var(--text); }
  tr:last-child td { border-bottom: none; }
  td.ips, td.networks { font-family: var(--mono); font-size: 13px; color: var(--accent); }
  .empty { color: var(--muted); font-style: italic; padding: 4px 0; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-family: var(--mono);
    font-size: 13px;
    padding: 3px 9px;
    border-radius: 999px;
    background: rgba(148, 163, 184, .12);
    border: 1px solid var(--border);
  }
  .chip.free { color: var(--free); }

  #error-banner {
    display: none;
    background: rgba(248, 113, 113, .12);
    border: 1px solid var(--error);
    color: var(--error);
    border-radius: 10px;
    padding: 10px 16px;
    margin-bottom: 16px;
    font-size: 13px;
  }
  a { color: var(--accent); }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 32px; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <div class="header-row">
    <h1><span id="status-dot" class="dot"></span> ip-scout</h1>
    <button id="scan-now" type="button">Scan now</button>
  </div>
  <div id="meta">Loading&hellip;</div>

  <div id="scan-progress" class="scan-progress" hidden>
    <div class="track"><div class="fill" id="scan-progress-fill"></div></div>
    <div class="detail" id="scan-progress-detail"></div>
  </div>

  <div id="error-banner"></div>

  <div class="next-free">
    <div>
      <div class="label">Next free IP</div>
      <div class="value" id="next-free">&mdash;</div>
    </div>
    <div class="count" id="free-count"></div>
  </div>

  <section>
    <h2>Containers</h2>
    <div id="containers"></div>
  </section>

  <section>
    <h2>Free IPs</h2>
    <div id="free-ips" class="chips"></div>
  </section>

  <footer>
    Auto-refreshes every 15s &middot;
    JSON at <a href="/api/status">/api/status</a> &middot;
    <a href="https://github.com/wmhunter96/ip-scout" target="_blank" rel="noopener">ip-scout</a>
  </footer>
</main>

<script>
(function () {
  const REFRESH_MS = 15000;
  const FAST_REFRESH_MS = 1000;
  const FAST_REFRESH_WINDOW_MS = 30000;
  const $ = (id) => document.getElementById(id);

  let fastPollTimer = null;
  let fastPollUntil = 0;

  function renderProgress(progress) {
    const wrap = $("scan-progress");
    if (!progress || !progress.scanning) {
      wrap.hidden = true;
      return;
    }
    wrap.hidden = false;
    const fraction = typeof progress.fraction === "number" ? progress.fraction : 0;
    // A freshly-started scan (fraction 0, e.g. nmap before its first stats
    // tick) has no real percentage yet -- show motion instead of a stuck bar.
    wrap.classList.toggle("indeterminate", fraction <= 0);
    $("scan-progress-fill").style.width = `${Math.round(fraction * 100)}%`;
    $("scan-progress-detail").textContent = progress.detail || "Scanning…";
  }

  function startFastPolling() {
    fastPollUntil = Date.now() + FAST_REFRESH_WINDOW_MS;
    if (fastPollTimer) return;
    fastPollTimer = setInterval(() => {
      if (Date.now() > fastPollUntil) {
        clearInterval(fastPollTimer);
        fastPollTimer = null;
        return;
      }
      refresh();
    }, FAST_REFRESH_MS);
  }

  async function triggerScanNow() {
    const btn = $("scan-now");
    const banner = $("error-banner");
    btn.disabled = true;
    btn.textContent = "Scanning…";
    try {
      const res = await fetch("/api/scan-now", { method: "POST" });
      if (!res.ok) {
        throw new Error(`server returned ${res.status}`);
      }
      await refresh();
      startFastPolling();
    } catch (err) {
      banner.style.display = "block";
      banner.textContent = "Couldn't start a scan: " + err;
    } finally {
      btn.disabled = false;
      btn.textContent = "Scan now";
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
    ));
  }

  function renderChips(container, ips, cls) {
    if (!ips || ips.length === 0) {
      container.innerHTML = '<span class="empty">none</span>';
      return;
    }
    container.innerHTML = ips
      .map((ip) => `<span class="chip ${cls}">${escapeHtml(ip)}</span>`)
      .join("");
  }

  // Container table sorting: click a header to sort by it (toggling
  // asc/desc on repeat clicks), defaulting to IP ascending. Sorting is
  // done client-side against the last-received list so it doesn't need a
  // fresh fetch, and survives the next auto-refresh since sortState persists.
  let lastContainers = [];
  let sortState = { key: "ip", dir: "asc" };

  function ipParts(ip) {
    if (!ip) return null;
    const parts = ip.split(".").map(Number);
    return parts.length === 4 && parts.every((n) => !Number.isNaN(n)) ? parts : null;
  }

  function compareIps(a, b, dir) {
    const pa = ipParts(a);
    const pb = ipParts(b);
    // No IP (e.g. host networking) always sorts last, in either direction --
    // applied before the asc/desc sign flip below rather than after, so
    // reversing the sort never brings blanks to the top.
    if (!pa && !pb) return 0;
    if (!pa) return 1;
    if (!pb) return -1;
    const sign = dir === "asc" ? 1 : -1;
    for (let i = 0; i < 4; i++) {
      if (pa[i] !== pb[i]) return (pa[i] - pb[i]) * sign;
    }
    return 0;
  }

  function sortContainers(containers, key, dir) {
    const sign = dir === "asc" ? 1 : -1;
    return [...containers].sort((a, b) => {
      if (key === "ip") return compareIps(a.ips && a.ips[0], b.ips && b.ips[0], dir);
      if (key === "networks") {
        return (a.networks || []).join(", ").localeCompare((b.networks || []).join(", ")) * sign;
      }
      return a.name.localeCompare(b.name) * sign;
    });
  }

  function headerCell(key, label) {
    const arrow = sortState.key !== key ? "" : sortState.dir === "asc" ? " ▲" : " ▼";
    return `<th class="sortable" data-key="${key}">${escapeHtml(label)}${arrow}</th>`;
  }

  function renderContainersTable() {
    const container = $("containers");
    if (lastContainers.length === 0) {
      container.innerHTML = '<div class="empty">No running containers</div>';
      return;
    }
    const rows = sortContainers(lastContainers, sortState.key, sortState.dir)
      .map((c) => {
        const ips = c.ips && c.ips.length ? c.ips.join(", ") : "(none / host network)";
        const nets = (c.networks || []).join(", ") || "&mdash;";
        return `<tr><td>${escapeHtml(c.name)}</td><td class="networks">${escapeHtml(nets)}</td><td class="ips">${escapeHtml(ips)}</td></tr>`;
      })
      .join("");
    container.innerHTML =
      `<table><thead><tr>${headerCell("name", "Name")}${headerCell("networks", "Network")}` +
      `${headerCell("ip", "IP")}</tr></thead><tbody>${rows}</tbody></table>`;
  }

  function renderContainers(containers) {
    lastContainers = containers || [];
    renderContainersTable();
  }

  async function refresh() {
    const dot = $("status-dot");
    const banner = $("error-banner");
    try {
      const res = await fetch("/api/status", { cache: "no-store" });
      const data = await res.json();

      if (res.status === 503) {
        dot.className = "dot";
        $("meta").textContent = "Waiting on the first scan to complete…";
        renderProgress(data.progress);
        if (data.progress && data.progress.scanning) startFastPolling();
        return;
      }

      dot.className = data.last_scan_error ? "dot err" : "dot live";
      banner.style.display = data.last_scan_error ? "block" : "none";
      if (data.last_scan_error) {
        banner.textContent = "Last scan failed, showing the most recent good result: " + data.last_scan_error;
      }
      renderProgress(data.progress);
      if (data.progress && data.progress.scanning) startFastPolling();

      $("meta").innerHTML =
        `Range <span>${escapeHtml(data.range)}</span> &middot; ` +
        `scan method <span>${escapeHtml(data.scan_method)}</span> &middot; ` +
        `last scanned <span>${escapeHtml(new Date(data.scanned_at).toLocaleString())}</span>`;

      $("next-free").textContent = data.next_free_ip || "none available";
      $("free-count").textContent =
        `${data.free_ip_count} free / ${data.used_ip_count} in use`;

      renderContainers(data.containers);
      renderChips($("free-ips"), data.free_ips, "free");
    } catch (err) {
      dot.className = "dot err";
      banner.style.display = "block";
      banner.textContent = "Couldn't reach /api/status: " + err;
    }
  }

  $("scan-now").addEventListener("click", triggerScanNow);

  // Event delegation: #containers' innerHTML gets replaced on every
  // render, but the div itself persists, so one listener here survives
  // across re-renders instead of needing to be re-attached each time.
  $("containers").addEventListener("click", (e) => {
    const th = e.target.closest("th[data-key]");
    if (!th) return;
    const key = th.dataset.key;
    sortState = sortState.key === key
      ? { key, dir: sortState.dir === "asc" ? "desc" : "asc" }
      : { key, dir: "asc" };
    renderContainersTable();
  });

  refresh();
  setInterval(refresh, REFRESH_MS);
})();
</script>
</body>
</html>
